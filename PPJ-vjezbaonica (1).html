 "n": 2, "q": "U zapisu „t = 4 * 5” što može zamijeniti desnu stranu još tijekom prevođenja?", "a": "20", "e": "Oba su operanda poznata pa se množenje može obaviti unaprijed.", "opts": ["20", "9", "16", "25"]}, {"id": "2-14", "n": 2, "q": "Koliko je množenja dovoljno za „p = a*b; q = a*b;” ako su to obične varijable, a i b se ne mijenjaju?", "a": "1", "e": "Rezultat prvog množenja može se upotrijebiti za oba pridruživanja.", "opts": ["1", "2", "3", "0"]}, {"id": "2-15", "n": 2, "q": "Koliko je puta potrebno izvesti tijelo petlje ako joj je početni uvjet uvijek neistinit, a uvjet se provjerava prije tijela?", "a": "0", "e": "Tijelo je nedohvatljivo jer ulaz u petlju ne prolazi provjeru.", "opts": ["0", "1", "2", "Ovisi o duljini tijela"]}, {"id": "2-16", "n": 2, "q": "Izračun „x = 2+3; y = x*2” koristi samo te poznate vrijednosti. Koja vrijednost može zamijeniti desnu stranu drugog pridruživanja?", "a": "10", "e": "Prvo je x jednak 5. Uvrštavanjem se dobiva 5 puta 2.", "opts": ["10", "7", "5", "12"]}, {"id": "2-17", "n": 2, "q": "Prevoditelj napisan u L prevodi programe iz P u Q. Njegov izvorni kod prevedemo iz L u A. Koji je ulazni jezik dobivene izvedbe?", "a": "P", "e": "Prevođenje izvedbe mijenja jezik kojim je zapisan sam prevoditelj. On i dalje prihvaća programe u P.", "opts": ["P", "A", "Q", "L"]}, {"id": "2-18", "n": 2, "q": "Prevoditelj iz P u Q napisan je u L. Prevedemo njegov izvorni tekst iz L u A. U kojem je jeziku zapisana nova izvedba?", "a": "A", "e": "Prevoditelj iz L u A prima tekst implementacije i proizvodi implementaciju u A.", "opts": ["P", "A", "Q", "L"]}, {"id": "2-19", "n": 2, "q": "Prevoditelj iz P u Q preveden je za stroj A. U kojem jeziku proizvodi izlaz kada njime prevedemo korisnički program?", "a": "Q", "e": "Ciljni jezik korisničkog prijevoda zadan je funkcijom prevoditelja iz P u Q.", "opts": ["P", "A", "Q", "L"]}, {"id": "2-20", "n": 2, "q": "Ako je izvorni tekst prevoditelja napisan u L, koji jezik mora prihvaćati alat kojim prevodimo taj tekst?", "a": "L", "e": "Za tu je izgradnju ulaz upravo tekst implementacije napisan u L.", "opts": ["P", "A", "Q", "L"]}, {"id": "3-1", "n": 3, "q": "Gdje se u tabličnoj organizaciji leksičkog analizatora za svaku pojavu jedinke čuva njezin uniformni prikaz?", "a": "Tablica uniformnih znakova", "e": "Čuva slijed pojava pa se ponovljeni identifikator ponovno pojavljuje u tom slijedu.", "opts": ["Tablica uniformnih znakova", "Tablica identifikatora", "Tablica konstanti", "KROS tablica"]}, {"id": "3-2", "n": 3, "q": "Gdje se pohranjuje zapis za novo korisničko ime varijable?", "a": "Tablica identifikatora", "e": "Različite pojave istog imena mogu se pozvati na isti zapis.", "opts": ["Tablica uniformnih znakova", "Tablica identifikatora", "Tablica konstanti", "KROS tablica"]}, {"id": "3-3", "n": 3, "q": "U koju tablicu pripada podatak o brojčanoj konstanti izdvojenoj iz zapisa programa?", "a": "Tablica konstanti", "e": "Uniformni znak može upućivati na zapis o vrijednosti konstante.", "opts": ["Tablica uniformnih znakova", "Tablica identifikatora", "Tablica konstanti", "KROS tablica"]}, {"id": "3-4", "n": 3, "q": "Gdje pripada unaprijed poznat simbol „ako” kad je rezervirana riječ?", "a": "KROS tablica", "e": "KROS obuhvaća ključne riječi, operatore i specijalne znakove.", "opts": ["Tablica uniformnih znakova", "Tablica identifikatora", "Tablica konstanti", "KROS tablica"]}, {"id": "3-5", "n": 3, "q": "Koje pravilo određuje kraj jedinke ako su prihvatljivi prefiksi a, ab i abc trenutnog ulaza abcd?", "a": "Najdulji prihvatljivi prefiks", "e": "Bira se abc jer obuhvaća više početnih znakova od preostala dva prihvaćena prefiksa.", "opts": ["Najdulji prihvatljivi prefiks", "Redoslijed pravila", "Odbacivanje prvoga znaka", "Regularni izraz"]}, {"id": "3-6", "n": 3, "q": "Dva pravila jednake duljine prepoznaju ključnu riječ. Koji kriterij iz predavanja razrješava izbor?", "a": "Redoslijed pravila", "e": "Uređeni popis daje prednost ranije navedenom pravilu među jednako dugim poklapanjima.", "opts": ["Najdulji prihvatljivi prefiks", "Redoslijed pravila", "Odbacivanje prvoga znaka", "Regularni izraz"]}, {"id": "3-7", "n": 3, "q": "Koji je najjednostavniji korak oporavka ako na trenutnom položaju nijedan prefiks nije dopušten?", "a": "Odbacivanje prvoga znaka", "e": "Time se omogućuje novo traženje jedinke od sljedećeg položaja.", "opts": ["Najdulji prihvatljivi prefiks", "Redoslijed pravila", "Odbacivanje prvoga znaka", "Regularni izraz"]}, {"id": "3-8", "n": 3, "q": "Što leksičkom analizatoru formalno opisuje dopušteni oblik identifikatora?", "a": "Regularni izraz", "e": "Njime se zadaje obrazac poput slova iza kojeg mogu slijediti slova i znamenke.", "opts": ["Najdulji prihvatljivi prefiks", "Redoslijed pravila", "Odbacivanje prvoga znaka", "Regularni izraz"]}, {"id": "3-9", "n": 3, "q": "Koliko uniformnih znakova daje „int a = 10; a = 10;” kada se razmaci odbacuju?", "a": "9", "e": "Prva naredba ima pet jedinki, a druga četiri.", "opts": ["9", "4", "2", "3"]}, {"id": "3-10", "n": 3, "q": "Koliko različitih KROS simbola ima u „int a = 10; a = a + 1;” ako je int ključna riječ?", "a": "4", "e": "Različiti su int, =, ; i +. Brojevi i ime a pripadaju drugim tablicama.", "opts": ["9", "4", "2", "3"]}, {"id": "3-11", "n": 3, "q": "Koliko različitih konstanti ima u „a = 1 + 11 + 1;”?", "a": "2", "e": "Različite su vrijednosti 1 i 11, iako postoje tri pojave konstanti.", "opts": ["9", "4", "2", "3"]}, {"id": "3-12", "n": 3, "q": "Koliko identifikatorskih jedinki daje „a12 = b3 + c4;” ako znamenke smiju slijediti početno slovo?", "a": "3", "e": "a12, b3 i c4 potpuna su imena. Njihove znamenke ne počinju nove jedinke.", "opts": ["9", "4", "2", "3"]}, {"id": "3-13", "n": 3, "q": "Za pravila ID = slovo(slovo ili znamenka)* i BROJ = znamenka+, što je prva jedinka na ulazu „ab42+7”?", "a": "ab42", "e": "Izraz za ime obuhvaća oba slova i obje znamenke. Znak + prekida poklapanje.", "opts": ["ab42", "ab", "==", "a"]}, {"id": "3-14", "n": 3, "q": "Pravila prepoznaju samo nizove slova ili samo nizove znamenki. Koja je prva jedinka na ulazu „ab42”?", "a": "ab", "e": "Niz slova završava neposredno prije prve znamenke.", "opts": ["ab42", "ab", "==", "a"]}, {"id": "3-15", "n": 3, "q": "Pravila su „==” i „=”. Koju jedinku analizator najprije izdvaja iz „===”?", "a": "==", "e": "Prva dva znaka tvore dulji prihvaćeni prefiks. Posljednji znak ostaje za sljedeći korak.", "opts": ["ab42", "ab", "==", "a"]}, {"id": "3-16", "n": 3, "q": "Pravila prihvaćaju samo „abc” i „a”. Na ulazu „abx”, koji je najdulji prihvaćeni prefiks?", "a": "a", "e": "Prefiks ab sam nije prihvatljiv, a treći znak ne dovršava abc.", "opts": ["ab42", "ab", "==", "a"]}, {"id": "3-17", "n": 3, "q": "Koji postupak pretražuje tablicu uspoređujući zapise jedan za drugim?", "a": "Slijedno traženje", "e": "Traženje može proći sve prethodne zapise prije pronalaska željenog imena.", "opts": ["Slijedno traženje", "Raspršeno adresiranje", "Komentari", "Leksička pogreška"]}, {"id": "3-18", "n": 3, "q": "Koji postupak računa ključ iz znakova imena i njime određuje mjesto traženja?", "a": "Raspršeno adresiranje", "e": "Funkcija raspršivanja preslikava ime na adresu ili skup zapisa koji treba pregledati.", "opts": ["Slijedno traženje", "Raspršeno adresiranje", "Komentari", "Leksička pogreška"]}, {"id": "3-19", "n": 3, "q": "Koji se dijelovi programa u opisanom jeziku mogu pročitati i odbaciti bez slanja parseru jer služe za bilješke autora?", "a": "Komentari", "e": "Analizator prepoznaje njihove granice i nastavlja tražiti sljedeću značajnu jedinku.", "opts": ["Slijedno traženje", "Raspršeno adresiranje", "Komentari", "Leksička pogreška"]}, {"id": "3-20", "n": 3, "q": "Koja je vrsta pogreške ako od trenutačnog položaja nijedno pravilo ne prepoznaje nijedan neprazan prefiks?", "a": "Leksička pogreška", "e": "Ulaz nije moguće razložiti na sljedeću dopuštenu jedinku.", "opts": ["Slijedno traženje", "Raspršeno adresiranje", "Komentari", "Leksička pogreška"]}, {"id": "4-1", "n": 4, "q": "Čime simulator pamti da su prethodno pročitani znakovi otvorili komentar?", "a": "Dodatno stanje simulatora", "e": "Stanje opisuje lijevi kontekst i određuje koja su pravila aktivna tijekom čitanja komentara.", "opts": ["Dodatno stanje simulatora", "r/s", "ODBACI", "LEX"]}, {"id": "4-2", "n": 4, "q": "Kojom se konstrukcijom pravilo za r primjenjuje samo ako neposredno iza njega slijedi uzorak s?", "a": "r/s", "e": "Desni se kontekst provjerava prije prihvaćanja. Dio koji odgovara izrazu s ostaje za daljnju obradu.", "opts": ["Dodatno stanje simulatora", "r/s", "ODBACI", "LEX"]}, {"id": "4-3", "n": 4, "q": "Koja naredba opisane akcije ponovno pokreće analizu istog početka uz privremeno isključenje upravo odabranog pravila?", "a": "ODBACI", "e": "Kazaljka se vraća na početak i simulator može primijeniti drugo pravilo.", "opts": ["ODBACI", "POMAKNI", "PRIHVATI", "REDUCIRAJ"]}, {"id": "4-4", "n": 4, "q": "Koji alat iz specifikacije regularnih izraza i akcija gradi leksički analizator?", "a": "LEX", "e": "Pravila opisuju koje nizove prepoznati i koji korisnički kod izvršiti pri prepoznavanju.", "opts": ["LEX", "Yacc", "LR parser", "Co-No parser"]}, {"id": "4-5", "n": 4, "q": "Koja je uobičajena ulazna datoteka u primjeru rada programa LEX?", "a": "lex.l", "e": "U njoj su deklaracije, pravila i pomoćne procedure.", "opts": ["lex.l", "lex.yy.c", "lex.y", "y.tab.c"]}, {"id": "4-6", "n": 4, "q": "Kako se zove C datoteka koju LEX u primjeru generira?", "a": "lex.yy.c", "e": "U nju ulaze tablice, kod za analizu i dijelovi korisničke specifikacije.", "opts": ["lex.yy.c", "lex.l", "y.tab.c", "translate.y"]}, {"id": "4-7", "n": 4, "q": "Koju generiranu funkciju poziva glavni program kada traži novu leksičku jedinku?", "a": "yylex()", "e": "Ona obavlja leksičku analizu i može vratiti oznaku prepoznate jedinke.", "opts": ["yylex()", "yylook()", "main()", "printf()"]}, {"id": "4-8", "n": 4, "q": "U kojoj se funkciji u prikazanoj organizaciji LEX-a nalazi simulator automata?", "a": "yylook()", "e": "Predavanje razlikuje vanjsko sučelje yylex od potprograma koji obavlja simulaciju.", "opts": ["yylook()", "yylex()", "main()", "printf()"]}, {"id": "4-9", "n": 4, "q": "Što simulator DKA treba pamtiti o stanju automata nakon pročitanog prefiksa?", "a": "Jedno trenutno stanje", "e": "Deterministički prijelaz za znak iz tog stanja jednoznačno određuje nastavak.", "opts": ["Jedno trenutno stanje", "Skup dosegljivih stanja", "ε-okruženje", "Posljednji prihvatljivi završetak"]}, {"id": "4-10", "n": 4, "q": "Što simulator ε-NKA treba ažurirati nakon znaka?", "a": "Skup dosegljivih stanja", "e": "Moguće je više prijelaza pa su istodobno relevantni svi dosegljivi putovi.", "opts": ["Jedno trenutno stanje", "Skup dosegljivih stanja", "ε-okruženje", "Posljednji prihvatljivi završetak"]}, {"id": "4-11", "n": 4, "q": "Koja operacija uključuje dodatna stanja dostupna bez potrošnje znaka?", "a": "ε-okruženje", "e": "Od početnog skupa slijede se svi mogući ε-prijelazi, uključujući put duljine nula.", "opts": ["Jedno trenutno stanje", "Skup dosegljivih stanja", "ε-okruženje", "Posljednji prihvatljivi završetak"]}, {"id": "4-12", "n": 4, "q": "Što se koristi ako simulator prije prekida prođe kroz nekoliko prihvatljivih prefiksa različitih duljina?", "a": "Posljednji prihvatljivi završetak", "e": "Taj položaj označava kraj najduljeg priznatog prefiksa, iako je simulator možda čitao dalje.", "opts": ["Jedno trenutno stanje", "Skup dosegljivih stanja", "ε-okruženje", "Posljednji prihvatljivi završetak"]}, {"id": "4-13", "n": 4, "q": "Za pravilo ab/c na ulazu abc koji dio ulaza postaje tekst upravo priznate jedinke?", "a": "ab", "e": "Znak c potreban je za provjeru desnog konteksta i ostaje na ulazu.", "opts": ["ab", "c", "bcx", "a"]}, {"id": "4-14", "n": 4, "q": "Na ulazu abc nakon izdvajanja jedinke pravilom ab/c koji dio ostaje neobrađen?", "a": "c", "e": "Izdvajanjem ab troše se samo prva dva znaka.", "opts": ["c", "ab", "abc", "bc"]}, {"id": "4-15", "n": 4, "q": "Ako su pravila abcd i a, na ulazu abcx koji dio preostaje nakon prve prihvaćene jedinke?", "a": "bcx", "e": "Dulje pravilo ne odgovara. Simulator se vraća iza posljednjeg prihvaćenog prefiksa a.", "opts": ["bcx", "cx", "x", "abcx"]}, {"id": "4-16", "n": 4, "q": "Pravilo za ab aktivno je samo u stanju U, pravilo za a vrijedi u početnom stanju. Što se prvo izdvaja iz ab u početnom stanju?", "a": "a", "e": "Pri izboru prefiksa sudjeluju samo pravila aktivna u tom stanju.", "opts": ["a", "ab", "b", "ε"]}, {"id": "4-17", "n": 4, "q": "Kako je zapisan izraz sa zbrajanjem u infiksnom obliku?", "a": "a + b", "e": "Infiks postavlja operator između dvaju operanada.", "opts": ["a + b", "− a b", "a b −", "a b c * +"]}, {"id": "4-18", "n": 4, "q": "Koji je prefiksni zapis razlike a − b?", "a": "− a b", "e": "Prvo se navodi operator, zatim lijevi i desni operand.", "opts": ["a + b", "− a b", "a b −", "a b c * +"]}, {"id": "4-19", "n": 4, "q": "Koji je postfiksni zapis razlike a − b?", "a": "a b −", "e": "Oba operanda prethode operatoru i zadržavaju svoj poredak.", "opts": ["a + b", "− a b", "a b −", "a b c * +"]}, {"id": "4-20", "n": 4, "q": "Koji je postfiksni zapis izraza a + b*c?", "a": "a b c * +", "e": "Najprije se zapisuju operandi podizraza b*c i njegovo množenje. Vanjsko zbrajanje dolazi posljednje.", "opts": ["a + b", "− a b", "a b −", "a b c * +"]}, {"id": "5-1", "n": 5, "q": "Odakle počinje izgradnja stabla pri parsiranju od vrha prema dnu?", "a": "Od početnog nezavršnog znaka", "e": "Korijen predstavlja početni znak. Produkcije proširuju čvorove prema ulaznim jedinkama.", "opts": ["Od početnog nezavršnog znaka", "Djeca čvora A redom su x, B i y", "Izvedeni ulazni niz", "BNF"]}, {"id": "5-2", "n": 5, "q": "Što u generativnom stablu predstavlja odabir produkcije A → xBy?", "a": "Djeca čvora A redom su x, B i y", "e": "Desna strana produkcije određuje neposrednu djecu proširenog nezavršnog znaka.", "opts": ["Od početnog nezavršnog znaka", "Djeca čvora A redom su x, B i y", "Izvedeni ulazni niz", "BNF"]}, {"id": "5-3", "n": 5, "q": "Što daje čitanje završnih znakova listova dovršenog stabla slijeva nadesno?", "a": "Izvedeni ulazni niz", "e": "Rub stabla daje redoslijed terminala nastalih izvođenjem.", "opts": ["Od početnog nezavršnog znaka", "Djeca čvora A redom su x, B i y", "Izvedeni ulazni niz", "BNF"]}, {"id": "5-4", "n": 5, "q": "Koji zapis opisuje sintaksu produkcijskim pravilima s nezavršnim znakovima i alternativama?", "a": "BNF", "e": "Backus–Naurov oblik koristi pravila za zapis mogućih izgradnji sintaksnih cjelina.", "opts": ["Od početnog nezavršnog znaka", "Djeca čvora A redom su x, B i y", "Izvedeni ulazni niz", "BNF"]}, {"id": "5-5", "n": 5, "q": "Koji oblik početka desne strane zahtijeva S-gramatika?", "a": "Završni znak", "e": "Prvi terminal omogućuje izbor produkcije čitanjem trenutnog znaka ulaza.", "opts": ["Završni znak", "Prazan niz ε", "SLIJEDI(A)", "Njihov je presjek prazan"]}, {"id": "5-6", "n": 5, "q": "Koja dodatna mogućnost desne strane postoji u Q-gramatici u odnosu na S-gramatiku?", "a": "Prazan niz ε", "e": "Prazna produkcija zahtijeva odluku prema znakovima koji mogu slijediti nezavršni znak.", "opts": ["Završni znak", "Prazan niz ε", "SLIJEDI(A)", "Njihov je presjek prazan"]}, {"id": "5-7", "n": 5, "q": "Koji skup daje PRIMIJENI za A → ε u Q-gramatici?", "a": "SLIJEDI(A)", "e": "Nakon prazne zamjene sljedeći ulazni znak mora moći doći iza A.", "opts": ["Završni znak", "Prazan niz ε", "SLIJEDI(A)", "Njihov je presjek prazan"]}, {"id": "5-8", "n": 5, "q": "Što mora vrijediti za skupove PRIMIJENI dviju različitih alternativa istoga znaka u Q-gramatici?", "a": "Njihov je presjek prazan", "e": "Isti ulazni znak tada ne može istodobno odabrati obje alternative.", "opts": ["Završni znak", "Prazan niz ε", "SLIJEDI(A)", "Njihov je presjek prazan"]}, {"id": "5-9", "n": 5, "q": "Za S → aS ili b, koliko se puta primijeni S → aS pri čitanju aaab?", "a": "3", "e": "Svako početno a dolazi iz jedne rekurzivne primjene. Posljednje b dolazi iz druge produkcije.", "opts": ["3", "2", "1", "5"]}, {"id": "5-10", "n": 5, "q": "Za S → aS ili b, koliko ukupno produkcija treba za izvođenje ab?", "a": "2", "e": "Izvođenje glasi S ⇒ aS ⇒ ab.", "opts": ["3", "2", "1", "5"]}, {"id": "5-11", "n": 5, "q": "Za S → aA, A → bA ili ε, koliko primjena A → ε treba za niz abb?", "a": "1", "e": "Nakon dviju primjena A → bA preostali A uklanja se jednom praznom produkcijom.", "opts": ["3", "2", "1", "5"]}, {"id": "5-12", "n": 5, "q": "Za S → aSb ili c, koliko završnih znakova ima niz nakon dvije rekurzivne primjene i zatim S → c?", "a": "5", "e": "Izvođenje daje aaSbb pa aacbb. Dva para a i b okružuju c.", "opts": ["3", "2", "1", "5"]}, {"id": "5-13", "n": 5, "q": "Pravila su (1) S → aA, (2) A → bA, (3) A → ε. Koji je redoslijed za ab?", "a": "1, 2, 3", "e": "S daje aA, A daje bA, a posljednji A nestaje.", "opts": ["1, 2, 3", "1, 1, 2", "1, 3", "1, 2, 2, 3"]}, {"id": "5-14", "n": 5, "q": "Pravila su (1) S → aS, (2) S → b. Koji je redoslijed za aab?", "a": "1, 1, 2", "e": "Dva početna a zahtijevaju dva proširenja, zatim b zatvara izvođenje.", "opts": ["1, 2, 3", "1, 1, 2", "1, 3", "1, 2, 2, 3"]}, {"id": "5-15", "n": 5, "q": "Pravila su (1) S → aA, (2) S → b, (3) A → c. Koji je redoslijed za ac?", "a": "1, 3", "e": "Znak a bira prvu produkciju, a c bira produkciju za A.", "opts": ["1, 2, 3", "1, 1, 2", "1, 3", "1, 2, 2, 3"]}, {"id": "5-16", "n": 5, "q": "Pravila su (1) S → aB, (2) B → bB, (3) B → c. Koji je redoslijed za abbc?", "a": "1, 2, 2, 3", "e": "Nakon a slijede dva b, svaki iz druge produkcije. Treća produkcija daje završno c.", "opts": ["1, 2, 3", "1, 1, 2", "1, 3", "1, 2, 2, 3"]}, {"id": "5-17", "n": 5, "q": "Za S → aAb, A → c ili ε, koji se znak nalazi u SLIJEDI(A)?", "a": "b", "e": "U jedinoj pojavi A odmah poslije njega dolazi terminal b.", "opts": ["b", "a", "c", "Oznaka kraja ulaza"]}, {"id": "5-18", "n": 5, "q": "Za S → aAb, A → c ili ε, koji ulazni znak bira A → c?", "a": "c", "e": "Neprazna alternativa započinje upravo terminalom c.", "opts": ["c", "a", "b", "Oznaka kraja ulaza"]}, {"id": "5-19", "n": 5, "q": "Za S → dA, A → e ili ε, čime se na ulazu d bira A → ε nakon čitanja d?", "a": "Oznakom kraja ulaza", "e": "A je na kraju početne produkcije pa može nestati kad je ostatak ulaza prazan.", "opts": ["Oznakom kraja ulaza", "Znakom d", "Znakom e", "Bilo kojim terminalom"]}, {"id": "5-20", "n": 5, "q": "Za pravila A → aB i A → aC koji znak stvara sukob pri izboru produkcije S-gramatike?", "a": "a", "e": "Obje alternative istog nezavršnog znaka počinju istim terminalom.", "opts": ["b", "c", "Oznakom kraja ulaza", "a"]}, {"id": "6-1", "n": 6, "q": "Koje izvođenje konstruira LL(1) parser?", "a": "Krajnje lijevo izvođenje", "e": "Proširuje krajnje lijevi preostali nezavršni znak, čitajući ulaz slijeva nadesno.", "opts": ["Krajnje lijevo izvođenje", "Krajnje desno izvođenje", "Obrnuto krajnje lijevo izvođenje", "Obrnuto krajnje desno izvođenje"]}, {"id": "6-2", "n": 6, "q": "Koliko unaprijed pročitanih ulaznih znakova koristi LL(1) za izbor produkcije?", "a": "Jedan", "e": "Broj u zagradi određuje duljinu uvida u nastavak ulaza.", "opts": ["Jedan", "Nijedan", "Dva", "Broj jednak dubini stoga"]}, {"id": "6-3", "n": 6, "q": "Koji se znak naziva praznim nezavršnim znakom?", "a": "Onaj koji može izvesti ε", "e": "Dovoljno je da postoji izvođenje praznog niza, čak i posrednim koracima.", "opts": ["Onaj koji može izvesti ε", "Onaj bez produkcija", "Onaj koji proizvodi samo terminale", "Onaj koji se ne pojavljuje lijevo"]}, {"id": "6-4", "n": 6, "q": "Po čemu se bira ćelija prediktivne tablice kada je na vrhu stoga nezavršni znak?", "a": "Po znaku na vrhu stoga i trenutnom ulaznom znaku", "e": "Redak predstavlja znak koji se proširuje, a stupac znak prema kojem se bira alternativa.", "opts": ["Po znaku na vrhu stoga i trenutnom ulaznom znaku", "Po dvama uzastopnim ulaznim znakovima", "Po dvama znakovima na vrhu stoga", "Po prethodnom terminalu i duljini stoga"]}, {"id": "6-5", "n": 6, "q": "S → AB, A → a ili ε, B → b. Koji je skup ZAPOČINJE(AB)?", "a": "{a, b}", "e": "Ako A daje a, niz počinje s a. Ako nestane, prvi je terminal b.", "opts": ["{a, b}", "{a}", "{b}", "{c}"]}, {"id": "6-6", "n": 6, "q": "S → AB, A → a, B → b ili ε. Koji je skup ZAPOČINJE(AB)?", "a": "{a}", "e": "A uvijek proizvodi a, pa B ne može dati prvi znak cijelog niza.", "opts": ["{a, b}", "{a}", "{b}", "{c}"]}, {"id": "6-7", "n": 6, "q": "S → AB, A → a ili ε, B → b. Koji je skup SLIJEDI(A)?", "a": "{b}", "e": "B obvezno započinje s b i uvijek stoji odmah iza A.", "opts": ["{a, b}", "{a}", "{b}", "{c}"]}, {"id": "6-8", "n": 6, "q": "S → Ac, A → a ili ε. Koji je skup PRIMIJENI(A → ε)?", "a": "{c}", "e": "Prazna desna strana nema početnog terminala pa izbor dolazi iz SLIJEDI(A).", "opts": ["{a, b}", "{a}", "{b}", "{c}"]}, {"id": "6-9", "n": 6, "q": "S → AB, A → a ili ε, B → b ili ε. Koji su nezavršni znakovi prazni?", "a": "S, A i B", "e": "A i B izravno daju ε. Njihova konkatenacija također može nestati pa je prazan i S.", "opts": ["S, A i B", "Samo A", "Nijedan", "Samo B"]}, {"id": "6-10", "n": 6, "q": "S → AB, A → a ili ε, B → b. Koji su nezavršni znakovi prazni?", "a": "Samo A", "e": "B uvijek daje terminal b pa ni S ne može izvesti prazan niz.", "opts": ["S, A i B", "Samo A", "Nijedan", "Samo B"]}, {"id": "6-11", "n": 6, "q": "S → AB, A → B, B → b. Koji su nezavršni znakovi prazni?", "a": "Nijedan", "e": "Svaka izvedba iz B daje b. Preko A → B to vrijedi i za A.", "opts": ["S, A i B", "Samo A", "Nijedan", "Samo B"]}, {"id": "6-12", "n": 6, "q": "S → aB, B → bB ili ε. Koji su nezavršni znakovi prazni?", "a": "Samo B", "e": "B ima praznu alternativu. Početni znak S obvezno stvara a.", "opts": ["S, A i B", "Samo A", "Nijedan", "Samo B"]}, {"id": "6-13", "n": 6, "q": "A → ab ili ac. Koja je ekvivalentna lijevo izlučena gramatika?", "a": "A → aR, R → b ili c", "e": "Zajedničko a pročita se jednom, a izbor nastavka odgađa se do razlikovnog znaka.", "opts": ["A → aR, R → b ili c", "R → ε ili b", "A → ac ili bc", "A → bR, R → aR ili ε"]}, {"id": "6-14", "n": 6, "q": "A → a ili ab. Što treba biti u pravilima za R ako nakon izlučivanja vrijedi A → aR?", "a": "R → ε ili b", "e": "Kraća alternativa završava iza a. Za nju nastavak mora moći biti prazan.", "opts": ["A → aR, R → b ili c", "R → ε ili b", "A → ac ili bc", "A → bR, R → aR ili ε"]}, {"id": "6-15", "n": 6, "q": "A → Bc, B → a ili b. Što daje zamjena početnog nezavršnog znaka B u produkciji za A?", "a": "A → ac ili bc", "e": "Svaka desna strana za B stavlja se ispred nepromijenjenog c.", "opts": ["A → aR, R → b ili c", "R → ε ili b", "A → ac ili bc", "A → bR, R → aR ili ε"]}, {"id": "6-16", "n": 6, "q": "A → Aa ili b. Koji oblik uklanja izravnu lijevu rekurziju i zadržava isti jezik?", "a": "A → bR, R → aR ili ε", "e": "Svaki konačni niz ima jedno b i zatim proizvoljan broj znakova a.", "opts": ["A → aR, R → b ili c", "R → ε ili b", "A → ac ili bc", "A → bR, R → aR ili ε"]}, {"id": "6-17", "n": 6, "q": "Relacija sadrži (A,B) i (B,C). Koji novi par nužno daje tranzitivnost?", "a": "(A,C)", "e": "Put A → B → C daje vezu između prvog i posljednjeg elementa.", "opts": ["(A,C)", "(C,A)", "(B,A)", "(C,B)"]}, {"id": "6-18", "n": 6, "q": "Relacija na skupu A,B,C nema parova. Koji par mora biti prisutan u refleksivnom zatvorenju za B?", "a": "(B,B)", "e": "Refleksivnost povezuje svaki element sa samim sobom.", "opts": ["(B,B)", "(A,B)", "(B,C)", "(C,B)"]}, {"id": "6-19", "n": 6, "q": "Za S → ABc, gdje A i B mogu nestati, koji je terminal iz te produkcije izravno dostupan na početku nakon preskakanja oba znaka?", "a": "c", "e": "Ispred c stoji samo niz praznih nezavršnih znakova.", "opts": ["c", "A", "B", "ε"]}, {"id": "6-20", "n": 6, "q": "Ako PRIMIJENI(A → α) = {a,b}, a PRIMIJENI(A → β) = {b,c}, koji terminal daje dvije moguće akcije?", "a": "b", "e": "Presjek je jednočlan. Na ulazu b nije moguće jednoznačno birati između α i β.", "opts": ["b", "a", "c", "Oznaka kraja"]}, {"id": "7-1", "n": 7, "q": "Koja akcija prenosi sljedeći ulazni znak na stog parsera od dna prema vrhu?", "a": "Pomakni", "e": "Kazaljka napreduje za jedan znak, a znak postaje dio sadržaja stoga.", "opts": ["Pomakni", "Reduciraj", "Prihvati", "Pronađi"]}, {"id": "7-2", "n": 7, "q": "Koja akcija zamjenjuje uzorak na vrhu stoga lijevom stranom produkcije?", "a": "Reduciraj", "e": "Prepoznata desna strana sažima se u nezavršni znak, bez trošenja novog ulaza.", "opts": ["Pomakni", "Reduciraj", "Prihvati", "Pronađi"]}, {"id": "7-3", "n": 7, "q": "Koja akcija označava da je parser uspješno dovršio obradu cijelog niza?", "a": "Prihvati", "e": "Niz je sveden na početnu strukturu i dosegnut je kraj ulaza.", "opts": ["Pomakni", "Reduciraj", "Prihvati", "Pronađi"]}, {"id": "7-4", "n": 7, "q": "Koja akcija u tablici Pomakni–Pronađi označava da treba odrediti uzorak za zamjenu?", "a": "Pronađi", "e": "Odluka o traženju uzorka prethodi pronalaženju odgovarajuće produkcije za redukciju.", "opts": ["Pomakni", "Reduciraj", "Prihvati", "Pronađi"]}, {"id": "7-5", "n": 7, "q": "Ako je stog zapisan slijeva nadesno od dna prema vrhu kao „# a” i ulaz počinje s b, što je na stogu nakon jednog pomaka?", "a": "# a b", "e": "Znak b prelazi s ulaza na vrh stoga. Prethodni sadržaj ostaje ispod njega.", "opts": ["# a b", "# A", "# a B", "# S"]}, {"id": "7-6", "n": 7, "q": "Stog je „# a b”. Kakav postaje primjenom redukcije A → a b?", "a": "# A", "e": "Uklanjaju se oba terminala i na isto se mjesto stavlja A.", "opts": ["# a b", "# A", "# a B", "# S"]}, {"id": "7-7", "n": 7, "q": "Stog je „# a b”. Kakav postaje primjenom redukcije B → b?", "a": "# a B", "e": "Desna strana ima samo b. Znak a ispod njega ostaje na stogu.", "opts": ["# a b", "# A", "# a B", "# S"]}, {"id": "7-8", "n": 7, "q": "Stog je „# a B”. Kakav postaje nakon redukcije S → a B?", "a": "# S", "e": "Oba znaka a i B pripadaju uzorku i zajedno se zamjenjuju jednim S.", "opts": ["# a b", "# A", "# a B", "# S"]}, {"id": "7-9", "n": 7, "q": "Parser je pomaknuo dva znaka, pa obavio tri redukcije. Koliko je ulaznih znakova potrošio?", "a": "2", "e": "Samo pomaci troše ulaz. Tri redukcije mijenjaju sadržaj stoga.", "opts": ["2", "3", "0", "1"]}, {"id": "7-10", "n": 7, "q": "Koliko se simbola uklanja sa stoga gramatičkih znakova pri redukciji A → b C d?", "a": "3", "e": "Uzorak na desnoj strani ima tri gramatička znaka. Zatim se stavlja A.", "opts": ["2", "3", "0", "1"]}, {"id": "7-11", "n": 7, "q": "Koliko se simbola uklanja sa stoga gramatičkih znakova pri redukciji A → ε?", "a": "0", "e": "Prazna desna strana ima duljinu nula. Lijeva strana dodaje se na stog.", "opts": ["2", "3", "0", "1"]}, {"id": "7-12", "n": 7, "q": "Za S → aA i A → b, koliko se simbola nalazi iznad dna nakon čitanja ab i obje potrebne redukcije?", "a": "1", "e": "Nakon redukcije b u A na stogu je aA, a nakon druge ostaje samo S.", "opts": ["2", "3", "0", "1"]}, {"id": "7-13", "n": 7, "q": "Za S → aA i A → b, kojim redom treba reducirati ulaz ab?", "a": "b u A, zatim aA u S", "e": "Najprije se dovršava podstablo za A. Tada je vidljiva desna strana početne produkcije.", "opts": ["b u A, zatim aA u S", "AB u S", "c u B", "(A) u S"]}, {"id": "7-14", "n": 7, "q": "Za S → AB, A → a i B → b, koja je posljednja redukcija za ab?", "a": "AB u S", "e": "Oba djeteta početnog znaka već su prepoznata kada se dovršava korijen.", "opts": ["b u A, zatim aA u S", "AB u S", "c u B", "(A) u S"]}, {"id": "7-15", "n": 7, "q": "Za S → A, A → B, B → c, koja je prva redukcija niza c?", "a": "c u B", "e": "Jedina produkcija s desnom stranom c jest B → c.", "opts": ["b u A, zatim aA u S", "AB u S", "c u B", "(A) u S"]}, {"id": "7-16", "n": 7, "q": "Za S → (A), A → a, koja je posljednja redukcija pri obradi (a)?", "a": "(A) u S", "e": "Nakon zamjene a znakom A cijela zagrada s unutarnjim A čini uzorak za S.", "opts": ["b u A, zatim aA u S", "AB u S", "c u B", "(A) u S"]}, {"id": "7-17", "n": 7, "q": "Pri oporavku prediktivnog parsera nađen je sinkronizacijski znak iz ZAPOČINJE(A), izvan SLIJEDI(A). Što s A na vrhu stoga?", "a": "Ostaviti A na stogu", "e": "Nađeni znak može započeti upravo očekivanu cjelinu pa se analiza A može nastaviti.", "opts": ["Ostaviti A na stogu", "Skinuti A i preskočiti sinkronizacijski znak", "Zamijeniti A početnim znakom", "Skinuti cijeli stog"]}, {"id": "7-18", "n": 7, "q": "Pri oporavku prediktivnog parsera sinkronizacijski znak je u SLIJEDI(A), ali nije u ZAPOČINJE(A). Što s A?", "a": "Skinuti A sa stoga", "e": "Nastavak ulaza može slijediti nakon A pa parser preskače oštećenu ili izostavljenu cjelinu.", "opts": ["Skinuti A sa stoga", "Ostaviti A i ponovno tražiti njegov početak", "Udvostručiti A na stogu", "Vratiti se na početak ulaza"]}, {"id": "7-19", "n": 7, "q": "Što učiniti s ulaznim znakovima prije prvog sinkronizacijskog znaka pri opisanom oporavku?", "a": "Preskočiti ih do sinkronizacije", "e": "Cilj je pronaći položaj s kojeg nastavak parsiranja ponovno ima smisla.", "opts": ["Preskočiti ih do sinkronizacije", "Prepisati ih na vrh stoga", "Vratiti ih ispred prethodne naredbe", "Prihvatiti cijeli niz"]}, {"id": "7-20", "n": 7, "q": "Koje izvođenje dobijemo čitanjem niza ispravnih redukcija obrnutim redoslijedom pri parsiranju od dna prema vrhu?", "a": "Krajnje desno izvođenje", "e": "Redukcije poništavaju korake ekspanzije krajnje desnoga nezavršnog znaka.", "opts": ["Krajnje desno izvođenje", "Krajnje lijevo izvođenje", "Obilazak stabla po razinama", "Niz stanja leksičkog automata"]}, {"id": "8-1", "n": 8, "q": "Koja je od ovih produkcija dopuštena u operatorskoj gramatici ako su A i B nezavršni, a ostali simboli završni?", "a": "E → A + B", "e": "Operator + razdvaja nezavršne znakove. Desna strana je neprazna.", "opts": ["E → A + B", "E → A B", "E → ε", "E → A B +"]}, {"id": "8-2", "n": 8, "q": "Koja produkcija krši uvjet operatorske gramatike upravo zbog neposredno susjednih nezavršnih znakova?", "a": "E → A B", "e": "Između A i B nema terminala preko kojeg bi se mogla utvrđivati prednost.", "opts": ["E → A B", "E → A + B", "E → A b B", "E → ε"]}, {"id": "8-3", "n": 8, "q": "Koja je produkcija nedopuštena u operatorskoj gramatici zato što je desna strana prazna?", "a": "E → ε", "e": "Model iz predavanja isključuje ε-produkcije.", "opts": ["E → ε", "E → A", "E → A B", "E → a"]}, {"id": "8-4", "n": 8, "q": "Ako vrijedi E → ( E ), koji se par terminala povezuje relacijom jednake prednosti zbog jednog umetnutog nezavršnog znaka?", "a": "( i )", "e": "Zagrade se pojavljuju u istoj produkciji s jednim nezavršnim znakom između njih.", "opts": ["( i )", "E i E", "( i E", "E i )"]}, {"id": "8-5", "n": 8, "q": "U izrazu a+b*c množenje ima višu prednost od zbrajanja. Koji se podizraz prvi grupira?", "a": "b*c", "e": "Množenje veže b i c prije nego što rezultat postane desni operand zbrajanja.", "opts": ["b*c", "a+b", "a*b", "a+c"]}, {"id": "8-6", "n": 8, "q": "Ako je oduzimanje lijevo asocijativno, kako se grupira a−b−c?", "a": "(a−b)−c", "e": "Pri istoj prednosti lijeva asocijativnost najprije zatvara lijevu operaciju.", "opts": ["(a−b)−c", "a−(b−c)", "a−(c−b)", "(b−c)−a"]}, {"id": "8-7", "n": 8, "q": "Ako je potenciranje desno asocijativno, kako se grupira a^b^c?", "a": "a^(b^c)", "e": "Desni par tvori podizraz čiji je rezultat eksponent vanjske operacije.", "opts": ["a^(b^c)", "(a^b)^c", "(b^c)^a", "a^(c^b)"]}, {"id": "8-8", "n": 8, "q": "U izrazu (a+b)*c koji se podizraz mora dovršiti prije množenja?", "a": "a+b", "e": "Zagrade određuju da zbroj bude cijeli lijevi operand množenja.", "opts": ["a+b", "b*c", "a*c", "a+b*c kao jedna nedjeljiva operacija"]}, {"id": "8-9", "n": 8, "q": "Koja se dva podatka koriste za pristup tablici Akcija LR parsera?", "a": "Stanje na vrhu stoga i ulazni terminal", "e": "Ova tablica odlučuje treba li pomaknuti, reducirati, prihvatiti ili prijaviti pogrešku.", "opts": ["Stanje na vrhu stoga i ulazni terminal", "Otkriveno stanje i nezavršni znak lijeve strane", "Prepoznato je a, očekuje se B c", "Dovršena je cijela desna strana"]}, {"id": "8-10", "n": 8, "q": "Koja se dva podatka koriste za pristup tablici NovoStanje nakon redukcije?", "a": "Otkriveno stanje i nezavršni znak lijeve strane", "e": "Nakon skidanja uzorka parser u automatu prati prijelaz za upravo prepoznatu cjelinu.", "opts": ["Stanje na vrhu stoga i ulazni terminal", "Otkriveno stanje i nezavršni znak lijeve strane", "Prepoznato je a, očekuje se B c", "Dovršena je cijela desna strana"]}, {"id": "8-11", "n": 8, "q": "Što opisuje zapis A → a • B c prije pomicanja točke?", "a": "Prepoznato je a, očekuje se B c", "e": "Točka omeđuje dio desne strane koji je već prepoznat.", "opts": ["Stanje na vrhu stoga i ulazni terminal", "Otkriveno stanje i nezavršni znak lijeve strane", "Prepoznato je a, očekuje se B c", "Dovršena je cijela desna strana"]}, {"id": "8-12", "n": 8, "q": "Što opisuje zapis A → a B c •?", "a": "Dovršena je cijela desna strana", "e": "Točka na kraju označava potpunu stavku i daje kandidata za redukciju.", "opts": ["Stanje na vrhu stoga i ulazni terminal", "Otkriveno stanje i nezavršni znak lijeve strane", "Prepoznato je a, očekuje se B c", "Dovršena je cijela desna strana"]}, {"id": "8-13", "n": 8, "q": "Akcija[2,a] = Pomakni(5). Koje je novo stanje na vrhu stoga?", "a": "5", "e": "Broj uz akciju pomaka upravo je odredišno stanje prijelaza za terminal a.", "opts": ["5", "7", "3", "0"]}, {"id": "8-14", "n": 8, "q": "Nakon skidanja uzorka u redukciji A → b ostalo je stanje 2. NovoStanje[2,A] = 7. Koje se stanje dodaje?", "a": "7", "e": "U tablici se koristi otkriveno stanje 2 i lijeva strana A pa se dobiva 7.", "opts": ["5", "7", "3", "0"]}, {"id": "8-15", "n": 8, "q": "Produkcija E → E + T primjenjuje se kao redukcija. Koliko parova znak–stanje treba ukloniti?", "a": "3", "e": "Desna strana sadrži E, + i T. Svakomu pripada jedan spremljeni par.", "opts": ["5", "7", "3", "0"]}, {"id": "8-16", "n": 8, "q": "Koliko početnih ili završnih terminala s ulaza troši jedna LR redukcija E → T?", "a": "0", "e": "Redukcija koristi već prepoznati dio na stogu. Trenutni ulazni znak ostaje za iduću odluku.", "opts": ["5", "7", "3", "0"]}, {"id": "8-17", "n": 8, "q": "U stavci A → • a B, kako izgleda stavka nakon prijelaza znakom a?", "a": "A → a • B", "e": "Prijelaz prepoznaje a pa točku premješta jedno mjesto udesno.", "opts": ["A → a • B", "A → • a B", "A → a B •", "S′ → S •"]}, {"id": "8-18", "n": 8, "q": "Koja je početna stavka same produkcije A → a B?", "a": "A → • a B", "e": "Na početku nije prepoznat nijedan znak desne strane.", "opts": ["A → a • B", "A → • a B", "A → a B •", "S′ → S •"]}, {"id": "8-19", "n": 8, "q": "Koja je potpuna stavka produkcije A → a B?", "a": "A → a B •", "e": "Svi znakovi desne strane nalaze se lijevo od točke.", "opts": ["A → a • B", "A → • a B", "A → a B •", "S′ → S •"]}, {"id": "8-20", "n": 8, "q": "Kada se u proširenoj početnoj produkciji S′ → S može razmatrati prihvat na kraju ulaza?", "a": "S′ → S •", "e": "Početna cjelina S prepoznata je u potpunosti, a oznaka kraja potvrđuje da nema ostatka.", "opts": ["A → a • B", "A → • a B", "A → a B •", "S′ → S •"]}, {"id": "9-1", "n": 9, "q": "Kako LR(0) raspoređuje redukciju obične potpune stavke u retku tablice Akcija?", "a": "U sve stupce ulaznih znakova", "e": "Bez dodatnog konteksta LR(0) ne razlikuje moguće nastavke pri upisu te redukcije.", "opts": ["U sve stupce ulaznih znakova", "Na znakove iz SLIJEDI(A)", "Znakovi uvida pridruženi toj stavci", "Stanja s istom LR(0) jezgrom"]}, {"id": "9-2", "n": 9, "q": "Na koje se znakove ograničava redukcija A → α pri SLR(1) konstrukciji?", "a": "Na znakove iz SLIJEDI(A)", "e": "Koristi se skup mogućih sljedbenika nezavršnog znaka u cijeloj gramatici.", "opts": ["U sve stupce ulaznih znakova", "Na znakove iz SLIJEDI(A)", "Znakovi uvida pridruženi toj stavci", "Stanja s istom LR(0) jezgrom"]}, {"id": "9-3", "n": 9, "q": "Što u LR(1) određuje stupce redukcije pojedine potpune stavke?", "a": "Znakovi uvida pridruženi toj stavci", "e": "Dopušteni nastavci odnose se na konkretan kontekst stavke.", "opts": ["U sve stupce ulaznih znakova", "Na znakove iz SLIJEDI(A)", "Znakovi uvida pridruženi toj stavci", "Stanja s istom LR(0) jezgrom"]}, {"id": "9-4", "n": 9, "q": "Koja se stanja kanonskog LR(1) automata spajaju pri gradnji LALR tablice?", "a": "Stanja s istom LR(0) jezgrom", "e": "Za odgovarajuće stavke sjedinjuju se skupovi znakova uvida.", "opts": ["U sve stupce ulaznih znakova", "Na znakove iz SLIJEDI(A)", "Znakovi uvida pridruženi toj stavci", "Stanja s istom LR(0) jezgrom"]}, {"id": "9-5", "n": 9, "q": "U jednoj ćeliji tablice pojavljuju se Pomakni(3) i Reduciraj(2). Koja je vrsta proturječja?", "a": "Pomakni/reduciraj", "e": "Parser treba odlučiti hoće li pročitati znak ili prije toga sažeti uzorak na stogu.", "opts": ["Pomakni/reduciraj", "Reduciraj/reduciraj", "Sintaksna pogreška", "Prihvati"]}, {"id": "9-6", "n": 9, "q": "U jednoj ćeliji nalaze se redukcije za A → x i B → x. Koja je vrsta proturječja?", "a": "Reduciraj/reduciraj", "e": "Dva su moguća nezavršna znaka kojima bi se zamijenio prepoznati uzorak.", "opts": ["Pomakni/reduciraj", "Reduciraj/reduciraj", "Sintaksna pogreška", "Prihvati"]}, {"id": "9-7", "n": 9, "q": "Što u tablici Akcija označava prazna ćelija za dosegnuto stanje i trenutni terminal?", "a": "Sintaksna pogreška", "e": "U toj konfiguraciji ne postoji dopušten nastavak analize.", "opts": ["Pomakni/reduciraj", "Reduciraj/reduciraj", "Sintaksna pogreška", "Prihvati"]}, {"id": "9-8", "n": 9, "q": "Što se upisuje za potpunu proširenu početnu stavku uz oznaku kraja?", "a": "Prihvati", "e": "Prepoznat je početni znak cijele gramatike na kraju ulaza.", "opts": ["Pomakni/reduciraj", "Reduciraj/reduciraj", "Sintaksna pogreška", "Prihvati"]}, {"id": "9-9", "n": 9, "q": "Za LR(1) stavku [A → b •, {c,d}] u koliko se stupaca upisuje ta redukcija?", "a": "2", "e": "Dva različita terminala iz skupa uvida, c i d, daju dva upisa.", "opts": ["2", "3", "4", "1"]}, {"id": "9-10", "n": 9, "q": "Dvije LR(1) stavke iste jezgre imaju uvide {a,b} i {b,c}. Koliko različitih znakova ima spojeni skup?", "a": "3", "e": "Unija je {a,b,c}. Zajedničko b broji se samo jednom.", "opts": ["2", "3", "4", "1"]}, {"id": "9-11", "n": 9, "q": "Koliko različitih položaja točke postoji za jednu LR(0) produkciju A → a B c?", "a": "4", "e": "Točka može stajati prije a, iza a, iza B ili iza c.", "opts": ["2", "3", "4", "1"]}, {"id": "9-12", "n": 9, "q": "Koliko različitih položaja točke postoji u LR stavci za A → ε?", "a": "1", "e": "Desna strana nema znakova. Početni položaj točke istodobno je završni.", "opts": ["2", "3", "4", "1"]}, {"id": "9-13", "n": 9, "q": "Pri zatvaranju [S → • A b, {c}], s kojim se uvidom dodaje početna stavka produkcije za A?", "a": "{b}", "e": "Iza A stoji obvezni terminal b pa on započinje svaki mogući nastavak.", "opts": ["{b}", "{c}", "{b,c}", "{a,b}"]}, {"id": "9-14", "n": 9, "q": "Pri zatvaranju [S → • A, {c}], s kojim se uvidom dodaje početna stavka produkcije za A?", "a": "{c}", "e": "Iza A nema simbola, pa se prenosi uvid roditeljske stavke.", "opts": ["{b}", "{c}", "{b,c}", "{a,b}"]}, {"id": "9-15", "n": 9, "q": "Pri zatvaranju [S → • A B, {c}], B → b ili ε. Koji je skup uvida za početne stavke od A?", "a": "{b,c}", "e": "B može početi s b ili nestati. U potonjem slučaju iza A dolazi roditeljski uvid c.", "opts": ["{b}", "{c}", "{b,c}", "{a,b}"]}, {"id": "9-16", "n": 9, "q": "Što ostaje od skupa uvida {a,b} nakon običnog pomicanja točke preko terminala u LR(1) stavci?", "a": "{a,b}", "e": "Prijelaz preko idućeg znaka mijenja položaj točke. Za tu stavku skup uvida ostaje isti.", "opts": ["{b}", "{c}", "{b,c}", "{a,b}"]}, {"id": "9-17", "n": 9, "q": "Koji alat iz predavanja generira parser na temelju gramatičkih pravila i akcija?", "a": "Yacc", "e": "Pravila se navode u specifikaciji iz koje se konstruira LALR parser.", "opts": ["Yacc", "LEX", "Simulator DKA za jedinke", "Generator strojnog programa"]}, {"id": "9-18", "n": 9, "q": "Koja Yacc deklaracija određuje lijevu asocijativnost?", "a": "%left", "e": "Kod sukoba iste prednosti lijeva asocijativnost daje prednost redukciji.", "opts": ["%left", "%right", "%nonassoc", "%prec"]}, {"id": "9-19", "n": 9, "q": "Koja Yacc deklaracija određuje desnu asocijativnost?", "a": "%right", "e": "Kod iste prednosti takav se izraz grupira udesno pa se daje prednost pomaku.", "opts": ["%right", "%left", "%nonassoc", "%prec"]}, {"id": "9-20", "n": 9, "q": "Koja Yacc deklaracija označava da operatori iste zadane skupine nisu asocijativni?", "a": "%nonassoc", "e": "Uzastopno ulančavanje iste prednosti tada može dovesti do prijave sintaksne pogreške.", "opts": ["%nonassoc", "%left", "%right", "%prec"]}, {"id": "10-1", "n": 10, "q": "Koja provjera otkriva da se potprogramu s dva formalna parametra predaju tri argumenta?", "a": "Provjera broja parametara", "e": "Uspoređuju se potpis potprograma i stvarne komponente poziva.", "opts": ["Provjera broja parametara", "Provjera podudarnosti tipova", "Vrsta identifikatora", "Djelokrug identifikatora"]}, {"id": "10-2", "n": 10, "q": "Koja provjera otkriva da je argument dopušten po položaju, ali ima nedopušten tip?", "a": "Provjera podudarnosti tipova", "e": "Broj argumenata može biti točan, a tip na pojedinom mjestu ipak ne odgovara potpisu.", "opts": ["Provjera broja parametara", "Provjera podudarnosti tipova", "Vrsta identifikatora", "Djelokrug identifikatora"]}, {"id": "10-3", "n": 10, "q": "Koji podatak razlikuje ime polja od imena potprograma u tablici identifikatora?", "a": "Vrsta identifikatora", "e": "Vrsta određuje koje su uporabe imena dopuštene, primjerice indeksiranje ili poziv.", "opts": ["Provjera broja parametara", "Provjera podudarnosti tipova", "Vrsta identifikatora", "Djelokrug identifikatora"]}, {"id": "10-4", "n": 10, "q": "Što opisuje u kojim je dijelovima programa određena deklaracija dostupna?", "a": "Djelokrug identifikatora", "e": "Pri obradi pojave imena treba odabrati deklaraciju vidljivu na to function resume(){return session&&session.pos<session.ids.length?'<div class="actions"><button class="secondary" id="resume">Nastavi započetu vježbu ('+(session.pos+1)+'/'+session.ids.length+')</button></div>':''}
function home(){
main.innerHTML='<section class="hero"><div><span class="eyebrow">Prvi ciklus · Priprema za međuispit</span><h1>Prevođenje<br>programskih jezika</h1><p>10 lekcija &nbsp;·&nbsp; '+bank.length+' pitanja s objašnjenjima</p><button class="primary" id="all">Vježbaj sve lekcije &nbsp; →</button></div><canvas width="640" height="330" aria-label="Sintaksno stablo izraza a + b * c"></canvas></section>'+resume()+statbar()+'<section><div class="sectionhead"><div><h2>Vježbaj po lekcijama</h2><p class="mut">'+(multi?'Označi lekcije koje želiš u zajedničkoj vježbi.':'Odaberi lekciju za vježbu iz tog predavanja.')+'</p></div><button class="secondary" id="multi">'+(multi?'Zatvori odabir':'Kombiniraj lekcije')+'</button></div><div class="grid">'+titles.map((t,i)=>{const qs=bank.filter(q=>q.n===i+1),done=qs.filter(q=>records[q.id]).length;return '<div class="lesson">'+(multi?'<label><input type="checkbox" data-check="'+i+'" aria-label="Odaberi: '+t+'" '+(selected.has(i)?'checked':'')+'></label>':'')+'<button data-lesson="'+i+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span><strong>'+t+'</strong><span class="mut">'+done+' / '+qs.length+' odgovorenih</span></span><span class="arrow">'+(multi?'':'→')+'</span></button></div>'}).join('')+'</div><div class="actions" id="selection"></div></section>';
draw();$('#all').onclick=()=>start(bank,'Sve lekcije');$('#multi').onclick=()=>{multi=!multi;home()};document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.lesson);if(multi){const cb=$('[data-check="'+i+'"]');cb.click()}else start(bank.filter(q=>q.n===i+1),titles[i])});document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{const i=Number(c.dataset.check);if(c.checked)selected.add(i);else selected.delete(i);selection()});selection();bindResume()}
function selection(){if(!multi)return;const amount=bank.filter(q=>selected.has(q.n-1)).length;$('#selection').innerHTML='<button class="primary" '+(amount?'':'disabled')+'>Pokreni odabir · '+amount+' pitanja →</button>';$('#selection button').onclick=()=>start(bank.filter(q=>selected.has(q.n-1)),'Odabrane lekcije')}
function bindResume(){if($('#resume'))$('#resume').onclick=()=>go('quiz')}
function draw(){const c=$('canvas'),g=c.getContext('2d');if(!g)return;g.lineWidth=2;const pts=[[260,53,'+'],[135,157,'a'],[386,157,'*'],[298,260,'b'],[475,260,'c']];g.strokeStyle='#719983';for(const [a,b] of [[0,1],[0,2],[2,3],[2,4]]){g.beginPath();g.moveTo(...pts[a].slice(0,2));g.lineTo(...pts[b].slice(0,2));g.stroke()}for(const [x,y,t] of pts){g.beginPath();g.arc(x,y,32,0,2*Math.PI);g.fillStyle=t==='+'||t==='*'?'#d9ef9e':'#245546';g.fill();g.stroke();g.fillStyle=t==='+'||t==='*'?'#173c32':'#ecf4e8';g.font='32px monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y+1)}}
function wrong(){const qs=mistakes();main.innerHTML='<div class="narrow"><div class="meta">Ponavljanje</div><h1>Moje pogreške</h1><p>Pitanje izlazi iz ove kategorije nakon dva uzastopna točna odgovora na njega. Svaka nova pogreška vraća niz na početak.</p>'+resume()+'<section class="card">'+(qs.length?'<div class="row"><h2>Za ponavljanje · '+qs.length+'</h2><button class="primary" id="review">Vježbaj pogreške →</button></div>'+qs.map(q=>'<div class="wrongitem"><span class="meta">Lekcija '+q.n+' · Niz '+records[q.id].streak+'/2</span><p>'+esc(q.q)+'</p></div>').join(''):'<h2>Nema pitanja za ponavljanje</h2><p class="mut">Ovdje će se pojaviti pitanja na koja pogrešno odgovoriš.</p><div class="actions"><button class="secondary" id="lessons">Otvori lekcije →</button></div>')+'</section></div>';if(qs.length)$('#review').onclick=()=>start(qs,'Moje pogreške');else $('#lessons').onclick=()=>go('home');bindResume()}
function start(qs,title){if(!qs.length)return;session={ids:shuffled(qs.map(q=>q.id)),pos:0,title,from:page==='wrong'?'wrong':'home',answer:null,order:null,score:0};nextOptions();save();go('quiz')}
function nextOptions(){session.answer=null;const q=byId.get(session.ids[session.pos]);session.order=q?shuffled(q.opts):null}
function answer(choice){if(!session||session.answer!==null)return;const q=byId.get(session.ids[session.pos]),r=records[q.id]||{tries:0,correct:0,miss:false,streak:0};session.answer=choice;r.tries++;if(choice===q.a){session.score++;r.correct++;if(r.miss&&++r.streak>=2)r.miss=false}else{r.miss=true;r.streak=0}records[q.id]=r;save();render();$('#next')?.focus({preventScroll:true})}
function quiz(){const s=session;if(!s){go('home');return}const q=byId.get(s.ids[s.pos]);if(!q){main.innerHTML='<div class="narrow"><div class="meta">Rezultat vježbe</div><section class="card"><h2>Vježba je završena</h2><p class="question">'+s.score+' / '+s.ids.length+' točnih odgovora</p><p>'+esc(s.title)+' · '+Math.round(100*s.score/s.ids.length)+' % točnosti</p><div class="actions"><button class="primary" id="finish">Povratak na lekcije</button><button class="secondary" id="errors">Moje pogreške ('+mistakes().length+')</button></div></section></div>';$('#finish').onclick=()=>go('home');$('#errors').onclick=()=>go('wrong');return}
const answered=s.answer!==null,ok=s.answer===q.a,r=records[q.id];main.innerHTML='<div class="narrow"><button id="back" class="quiet back">← '+(s.from==='wrong'?'Moje pogreške':'Lekcije')+'</button><div class="row"><strong>'+esc(s.title)+'</strong><span class="mut">Pitanje '+(s.pos+1)+' od '+s.ids.length+'</span></div><div class="track"><i style="width:'+100*(s.pos+(answered?1:0))/s.ids.length+'%"></i></div><section class="card"><span class="meta">Lekcija '+String(q.n).padStart(2,'0')+' · '+titles[q.n-1]+'</span><h2 class="question">'+esc(q.q)+'</h2><div class="answers">'+s.order.map((opt,i)=>'<button class="answer '+(answered?(opt===q.a?'good':opt===s.answer?'bad':''):'')+'" data-option="'+i+'" '+(answered?'disabled':'')+'><span class="letter">'+'ABCD'[i]+'</span><span>'+esc(opt)+'</span>'+(answered&&opt===q.a?'<small>✓ Točno</small>':answered&&opt===s.answer?'<small>✕ Tvoj odgovor</small>':'')+'</button>').join('')+'</div>'+(answered?'<div class="feedback '+(ok?'good':'bad')+'" role="status"><strong>'+(ok?'Točan odgovor':'Točan odgovor je '+esc(q.a))+'</strong><p>'+esc(q.e)+'</p><small>Predavanje '+q.n+(r.miss?' · Moje pogreške: '+r.streak+'/2 uzastopna točna':r.streak===2?' · Ponavljanje završeno':'')+'</small></div><div class="actions"><button id="next" class="primary">'+(s.pos+1===s.ids.length?'Prikaži rezultat':'Sljedeće pitanje')+' →</button></div>':'')+'</section></div>';
$('#back').onclick=()=>go(s.from);document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer(s.order[Number(b.dataset.option)]));if(answered)$('#next').onclick=()=>{s.pos++;nextOptions();save();go('quiz')}}
function render(){nav();if(page==='wrong')wrong();else if(page==='quiz')quiz();else home()}
$('#homeNav').onclick=()=>go('home');$('#wrongNav').onclick=()=>go('wrong');render();

const themeToggle = document.getElementById('themeToggle');
function syncThemeButton() {
 themeToggle.setAttribute('aria-pressed', String(document.documentElement.dataset.theme === 'dark'));
}
syncThemeButton();
themeToggle.onclick = () => {
 const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
 document.documentElement.dataset.theme = next;
 syncThemeButton();
 try { localStorage.setItem(themeKey, next); } catch {}
};
</script></body></html>
